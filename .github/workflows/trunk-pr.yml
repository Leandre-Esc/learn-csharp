name: Trunk PR

on:
  pull_request:
    branches:
      - main
      - release/*
    
concurrency: 
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
  
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore LearnCSharp.slnx
      - run: dotnet build LearnCSharp.slnx -c Release --no-restore
      - run: dotnet test LearnCSharp.slnx -c Release --no-build